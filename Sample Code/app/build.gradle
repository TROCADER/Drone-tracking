import java.util.Properties

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Read local.properties at the top of the file
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

repositories {
    mavenLocal()
}

android {
    compileSdk = 37
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId = "com.dji.sdk.sample"
        minSdk = 23
        targetSdk = 31
        multiDexEnabled = true
        versionCode = 1
        ndk {
            // On x86 devices that run Android API 23 or above, if the application is targeted with API 23 or
            // above, FFmpeg lib might lead to runtime crashes or warnings.
            abiFilters 'armeabi-v7a','arm64-v8a'
        }
        // Inject as a manifest placeholder
        def djiSdkApiKey = localProperties.getProperty("DJI_SDK_API_KEY") ?: ""
        manifestPlaceholders["DJI_SDK_API_KEY"] = djiSdkApiKey
    }

    //需要直接使用appbundle的话，需要强制配置shrinkResources为false
    buildTypes {
        release {
            shrinkResources = false
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources = false
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

     dexOptions {
         javaMaxHeapSize = "4g"
     }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['*/*/libdjivideo.so', '*/*/libSDKRelativeJNI.so', '*/*/libFlyForbid.so', '*/*/libduml_vision_bokeh.so', '*/*/libyuv2.so', '*/*/libGroudStation.so', '*/*/libFRCorkscrew.so', '*/*/libUpgradeVerify.so', '*/*/libFR.so', '*/*/libDJIFlySafeCore.so', '*/*/libdjifs_jni.so', '*/*/libsfjni.so', '*/*/libDJICommonJNI.so', '*/*/libDJICSDKCommon.so', '*/*/libDJIUpgradeCore.so', '*/*/libDJIUpgradeJNI.so', '*/*/libDJIWaypointV2Core.so', '*/*/libAMapSDK_MAP_v6_9_2.so', '*/*/libDJIMOP.so', '*/*/libDJISDKLOGJNI.so']
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/rxjava.properties', 'assets/location_map_gps_locked.png', 'assets/location_map_gps_3d.png']
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace = 'com.dji.sdk.sample'
}

dependencies {
    implementation libs.androidx.multidex
    implementation libs.otto
    implementation('com.dji:dji-sdk:4.18', {
        /**
         * Uncomment the "library-anti-distortion" if your app does not need Anti Distortion for Mavic 2 Pro and Mavic 2 Zoom.
         * Uncomment the "fly-safe-database" if you need database for release, or we will download it when DJISDKManager.getInstance().registerApp
         * is called.
         * Both will greatly reducing the size of the APK.
         */
        exclude module: 'library-anti-distortion'
        //exclude module: 'fly-safe-database'
    })
    // Should only by compiled, not implemented
    compileOnly libs.dji.sdk.provided

    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.lifecycle.extensions1
    implementation libs.androidx.annotation
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.kotlin.stdlib
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android
//    implementation libs.play.services

    implementation libs.androidx.lifecycle.common.java8
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.process
    implementation libs.androidx.lifecycle.viewmodel.ktx

    implementation libs.guava
    implementation libs.commons.math3

    implementation libs.subsampling.scale.image.view
    implementation libs.rxjava
    implementation libs.rxandroid

    implementation libs.executorch
}